services:
  web:
    build: .
    ports:
      - "5001:5000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=taskapp
      - MYSQL_PASSWORD=your_password
      - MYSQL_DATABASE=task_management
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=task_management
      - MYSQL_USER=taskapp
      - MYSQL_PASSWORD=your_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
